; Copia este archivo como chatbot-config.ini y subilo UN NIVEL ARRIBA de la
; carpeta publica (si el proxy esta en /public_html/chat/, el ini va en
; /public_html/). Nunca dentro de la carpeta que sirve el navegador.

OLLAMA_API_KEY = pega_aqui_tu_key_de_ollama
OLLAMA_BASE_URL = https://ollama.com/v1
OLLAMA_MODEL = gpt-oss:120b

; Dominios que pueden usar el bot, separados por coma. No uses '*'.
ALLOWED_ORIGINS = https://tudominio.com,https://www.tudominio.com

; Mensajes por hora y por IP. Es lo que protege tu cuota gratis.
RATE_LIMIT_PER_HOUR = 30

; Failover opcional (otra cuenta, modelo mas chico o un Ollama local)
; FAILOVER_BASE_URL = https://ollama.com/v1
; FAILOVER_MODEL = gpt-oss:20b
; FAILOVER_API_KEY =
